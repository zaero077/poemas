<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>20 poemas del amor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero" id="hero" role="banner">
    <div class="hero-inner" id="heroButton" role="button" aria-label="Abrir colección 20 poemas del amor" tabindex="0">
      <img id="heroImg" class="hero-img" alt="Portada 20 poemas del amor" />
      <div class="hero-title">
        <h1>20 poemas del amor</h1>
        <p class="hero-sub">Haz clic para abrir la colección</p>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="categories" id="categories" aria-label="Categorías de poemas">
      <!-- tres cuadrados de categoría se renderizan desde JS -->
    </section>
  </main>

  <!-- modal único que alterna entre: vista-colección/vista-categoría y vista-poema -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <button class="close-btn" id="closeBtn" aria-label="Cerrar">Cerrar ✕</button>
      <h2 id="modalTitle"></h2>

      <!-- contenedor que mostrará: grid de items (colección o categoría) -->
      <div id="modalGrid" class="modal-grid" tabindex="0"></div>

      <!-- contenedor detalle poema (oculto cuando se muestra grid) -->
      <pre id="modalPoem" class="modal-poem" tabindex="0" style="display:none;"></pre>

      <div class="modal-foot" id="modalFoot" style="display:none;">
        <button id="prevBtn" class="nav-btn" aria-label="Poema anterior">◀︎ Anterior</button>
        <button id="nextBtn" class="nav-btn" aria-label="Siguiente poema">Siguiente ▶︎</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
