<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>20 poemas del amor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero" id="hero" role="banner" aria-hidden="false">
    <div class="hero-inner" id="heroButton" role="button" aria-label="Abrir colección 20 poemas del amor" tabindex="0">
      <img id="heroImg" class="hero-img" alt="Portada 20 poemas del amor" />
      <div class="hero-title">
        <h1>20 poemas del amor</h1>
        <p class="hero-sub">Haz clic para entrar</p>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="grid" id="grid" aria-live="polite" aria-label="Lista de poemas"></section>
  </main>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <button class="close-btn" id="closeBtn" aria-label="Cerrar poema">Cerrar ✕</button>
      <h2 id="modalTitle"></h2>
      <!-- usamos PRE para preservar saltos y estructura del poema -->
      <pre id="modalBody" class="modal-body poem" tabindex="0"></pre>
      <div class="modal-foot">
        <button id="prevBtn" class="nav-btn" aria-label="Poema anterior">◀︎ Anterior</button>
        <button id="nextBtn" class="nav-btn" aria-label="Siguiente poema">Siguiente ▶︎</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
